<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ishaan Gupta — Play</title>
<meta name="description" content="A desk with nothing on it. Draw, stack, leave a note.">
<meta name="theme-color" content="#f7f6f3">
<!-- The one font the page always needs, started before the stylesheet has been
     parsed. Without this the request only begins once the CSS is read and the
     first glyph is wanted, which is a swap you can see. The italic and the mono
     are not preloaded on purpose: one word on the home page is italic and only
     case studies set code, so both can arrive late without anything moving. -->
<link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
<!-- THE ENTRANCE DECIDES BEFORE THE FIRST PAINT.
     What this is: site.js section 5c2c, site.css sections 44 and 44b. Why it
     cannot live in site.js: the sheet is the page's own paper and the document
     starts white, and site.js runs at the end of the body — a decision made
     there is one painted frame of the wrong colour before the right one. So
     the test is applied here, in the head, and this block is byte-identical in
     every page that loads the script. Only one thing differs between them, and
     it is an attribute on <html>: see below.

     ARRIVING, NOT MOVING. An intro is something you sit through when you get
     somewhere; the moment it becomes a toll on every click it stops being an
     intro and starts being a wait. So it plays on an arrival at the home page —
     a cold visit, a typed address, a bookmark, and a reload, which is an
     arrival at the same address and the thing you do most while building the
     site — and it does not play on a click, on back or forward, or anywhere
     else on the site.

     ONLY THE LANDING PAGE HAS AN ENTRANCE, and `data-entrance` on <html> in
     index.html is the whole of that decision. The sheet is a drawing OF the
     home page: `Boot.marks` measures the masthead's statement and each project
     card's image box off the live layout, and on About, Play, a case study or
     the 404 it would find none of them and put up a blank sheet. So those
     pages run this identical block, clear the flag below, and return. The
     attribute is deliberately not a path test — `/`, `/index.html` and a
     rewritten `/` are the same page under three spellings, and a rule that has
     to know which is a rule that will be wrong on a rename.

     AND SWITCHING SECTIONS NEVER REACHES HERE AT ALL. Work, About and Play are
     views of one shell: `Route` swaps them with `pushState` and no navigation,
     so the document is not reloaded and there is no load to suppress. Reloading
     while on About loads about.html, which has no `data-entrance`, so that is
     answered too — by the same line, not a second rule.

     WHAT CHANGED, AND WHY THE OLD RULE HAD TO GO. This used to gate on a
     session flag: the first page of the tab armed and marked the session, and
     every page after it read the mark and did not. That is a clean mechanism
     and it got one case wrong on purpose — a reload of the home page, which is
     the most common way anybody sees this sequence, was treated as "already
     seen" and skipped. The flag has been replaced by two facts that are not
     inferences either: the browser's own report of what kind of navigation
     this was, and a flag the LEAVING page writes (`hop` in site.js).

     THE FAILSAFE IS THE TIMEOUT: if site.js never lands, the class comes off
     by itself and the page is simply the page. -->
<script>
(function () {
  try {
    var d = document.documentElement;

    /* READ AND CLEAR, ON EVERY PAGE, BEFORE ANYTHING CAN RETURN. `site:hop` is
       set by `hop()` in site.js immediately before an internal link hands an
       address to the browser. Every page consumes it — including the ones with
       no entrance — so it is true for exactly one load and can never go stale
       and suppress a genuine arrival later in the session. */
    var hopped = false;
    try {
      hopped = !!sessionStorage.getItem('site:hop');
      sessionStorage.removeItem('site:hop');
    } catch (e) { /* private mode */ }

    if (!d.hasAttribute('data-entrance')) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    /* `?intro` forces it, which is how you watch the sequence without caring
       how you got here. */
    if (!/(^|[?&])intro(=|&|$)/.test(location.search)) {
      /* BACK AND FORWARD ARE NOT ARRIVALS, and this is the browser reporting
         its own navigation rather than the page guessing from a header. A
         restore from the back/forward cache never runs this script at all; a
         back that has to rebuild the document does, and lands here. */
      var nav = null;
      try { nav = performance.getEntriesByType('navigation')[0]; } catch (e) {}
      if (nav && nav.type === 'back_forward') return;
      /* and a click is not an arrival. A reload cannot see this flag — the
         load that followed the click already consumed it — which is exactly
         why a reload arms and the click that preceded it did not. */
      if (hopped) return;
    }

    d.classList.add('wake-armed');
    setTimeout(function () { d.classList.remove('wake-armed'); }, 4000);
  } catch (e) {}
})();
</script>
<!-- The mark follows the reader's system theme, not the site's. favicon.svg
     carries the media query inside it, which Chrome and Firefox honour;
     Safari renders SVG favicons but ignores their CSS, so the dark copy is
     also linked with a media attribute it does understand. The PNG is for
     anything that cannot take an SVG at all, and favicon.ico answers the
     request browsers make whether it is linked or not. The apple-touch icon
     has to be a PNG — iOS will not take the SVG — and is full-bleed square
     because iOS rounds the corners itself.

     AT THE ROOT, NOT IN assets/img, AND THAT IS A CACHING DECISION. Everything
     under assets/img is pictures that never change once they are published, so
     vercel.json tells browsers to keep them for a week. An icon is not that: it
     is a small file that changes when the brand does, and a week of a stale one
     is a week of the old mark in everybody's tab. Out here it falls under the
     short-lived rule instead — and it is where /favicon.ico and
     /apple-touch-icon.png are probed for anyway. -->
<link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ishaan Gupta">
<meta property="og:title" content="Ishaan Gupta — Play">
<meta property="og:description" content="A desk with nothing on it. Draw, stack, leave a note.">
<meta property="og:image" content="assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ishaan Gupta — Play">
<meta name="twitter:description" content="A desk with nothing on it. Draw, stack, leave a note.">
<meta name="twitter:image" content="assets/img/og.png">
<!-- THE THEME, BEFORE THE FIRST PAINT.

     site.js runs at the end of the body, and without these lines a visitor
     arriving in the evening gets a full white page for as long as it takes to
     parse it. The rule is the same one `Theme` uses and is stated in full here
     so the first frame is never a guess: a choice made by hand earlier in this
     tab if there is one, and otherwise the local hour — six in the morning to
     six in the evening is light, the rest of the day is dark.

     `sessionStorage`, not `localStorage`, and that is the whole persistence
     model: a deliberate press follows the visitor through every link on the
     site and dies with the tab, so the next visit asks the clock again rather
     than replaying a choice made at a different time of day. -->
<script>
(function () {
  var t = null;
  try { t = sessionStorage.getItem('site:theme'); } catch (e) { /* private mode */ }
  if (t !== 'light' && t !== 'dark') {
    var h = new Date().getHours();
    t = (h >= 6 && h < 18) ? 'light' : 'dark';
  }
  if (t === 'dark') document.documentElement.classList.add('is-dark');
})();
</script>
</head>
<body data-page="play">


  <div class="sheet">
    <main id="main">
      <div id="hero"></div>
    </main>
  </div>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
