<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" fill="none">
  <!-- A quiet workspace. Swap for your own artwork if you like. -->

  <!-- shelf -->
  <rect x="322" y="34" width="150" height="5" rx="2.5" fill="#cfc9bf"/>
  <rect x="336" y="12" width="9" height="22" rx="2" fill="#c8785e"/>
  <rect x="348" y="16" width="7" height="18" rx="2" fill="#e0b06a"/>
  <rect x="358" y="10" width="10" height="24" rx="2" fill="#7f9bb5"/>
  <rect x="371" y="18" width="6" height="16" rx="2" fill="#a7b58e"/>

  <!-- hanging plant -->
  <path d="M424 39v14" stroke="#b7b0a5" stroke-width="1.6"/>
  <path d="M410 53h30l-4 14h-22z" fill="#c8785e"/>
  <path d="M425 67q-4 22-16 30M425 67q3 18 14 24M425 67q-1 26 1 34" stroke="#6f9e78" stroke-width="2.4" stroke-linecap="round"/>

  <!-- lamp -->
  <path d="M92 232v-96q0-16 16-16h34" stroke="#b7b0a5" stroke-width="3" stroke-linecap="round"/>
  <path d="M138 112h30l-9 20h-12z" fill="#e0b06a"/>
  <ellipse cx="153" cy="146" rx="26" ry="7" fill="#f2e2b8" opacity=".55"/>

  <!-- desk -->
  <rect x="34" y="230" width="452" height="8" rx="4" fill="#c9a577"/>
  <rect x="46" y="238" width="10" height="52" rx="3" fill="#b8926a"/>
  <rect x="462" y="238" width="10" height="52" rx="3" fill="#b8926a"/>

  <!-- drawers -->
  <rect x="66" y="176" width="96" height="54" rx="5" fill="#d8b487"/>
  <path d="M66 194h96M66 212h96" stroke="#bd9a70" stroke-width="1.6"/>
  <rect x="104" y="184" width="20" height="3" rx="1.5" fill="#a8865f"/>
  <rect x="104" y="202" width="20" height="3" rx="1.5" fill="#a8865f"/>
  <rect x="104" y="220" width="20" height="3" rx="1.5" fill="#a8865f"/>

  <!-- monitor -->
  <rect x="196" y="126" width="128" height="82" rx="6" fill="#2b2a28"/>
  <rect x="203" y="133" width="114" height="68" rx="3" fill="#8fb8cf"/>
  <path d="M212 190h44M212 178h72M212 166h58" stroke="#e8f2f7" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <rect x="252" y="208" width="16" height="14" fill="#2b2a28"/>
  <rect x="234" y="222" width="52" height="6" rx="3" fill="#2b2a28"/>

  <!-- keyboard + mouse -->
  <rect x="212" y="222" width="72" height="8" rx="3" fill="#e6e2da"/>
  <ellipse cx="302" cy="226" rx="8" ry="5" fill="#e6e2da"/>

  <!-- easel -->
  <path d="M356 288l30-118M446 288l-30-118M366 226h70" stroke="#a89b88" stroke-width="3" stroke-linecap="round"/>
  <rect x="358" y="140" width="86" height="86" rx="3" fill="#eef3f1" stroke="#c9c2b6" stroke-width="2"/>
  <path d="M372 210q16-40 30-24t28-30" stroke="#8fb8cf" stroke-width="3" stroke-linecap="round"/>

  <!-- chair -->
  <path d="M180 288v-40q0-10 10-10h24" stroke="#8f8577" stroke-width="3" stroke-linecap="round"/>
  <rect x="172" y="238" width="46" height="9" rx="4" fill="#8f8577"/>

  <!-- mug + papers -->
  <path d="M336 216h16v12q0 4-4 4h-8q-4 0-4-4z" fill="#c8785e"/>
  <path d="M352 220q6 0 6 4t-6 4" stroke="#c8785e" stroke-width="2"/>
  <path d="M164 226l26-6 4 10-26 6z" fill="#f4f1ea" stroke="#d8d3c8" stroke-width="1.4"/>

  <!-- sleeping companion, because every desk has one -->
  <path d="M60 288q-14-2-14-12 0-9 12-11 8-1 14 4 8-8 20-6 14 3 14 14 0 11-16 11z" fill="#d98a86"/>
  <path d="M118 283q18-6 34 0 14 6 30 2" stroke="#d98a86" stroke-width="7" stroke-linecap="round"/>
  <circle cx="56" cy="272" r="2" fill="#5d3a38"/>
  <path d="M50 268q4-6 10-4" stroke="#5d3a38" stroke-width="1.6" stroke-linecap="round"/>
</svg>
