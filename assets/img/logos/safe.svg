<!-- Placeholder mark. Drop the real logo in at this path and it just works.
     THE viewBox IS THE MARK'S OWN INK BOX, not a 24-square with the glyph
     floating in it. Three logos drawn inside three 24-squares with three
     different amounts of padding render at three different optical sizes
     however carefully the CSS is written — there is no rule that can trim
     whitespace out of an SVG. Tightened here, one inset in the stylesheet
     gives every mark the same weight. Stroke width is included in the box. -->
