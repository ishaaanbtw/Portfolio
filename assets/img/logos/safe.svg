        fill="none" stroke="#08120c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M8.8 12.2l2.4 2.4 4-4.6" fill="none" stroke="#08120c"
        stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
