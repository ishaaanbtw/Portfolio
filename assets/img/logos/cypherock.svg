  <path d="M0 64.71 39.42 120.52 69.94 75.61 85.38 75.5 64.4 106.3 60.14 100.23 55.63 106.99 64.56 120.72 100 68.64 65.55 68.49 39.63 106.56 15.18 72.01 30.67 71.83 43.74 90.1 48.25 83.31 35.29 64.94Z"/>
  <path d="M100 52.18 64.58 0 55.63 13.83 60.14 20.49 64.07 14.52 64.51 14.62 85.38 45.22 70.04 45.22 39.42 0.2 0.1 55.98 35.06 56.01 48.15 37.61 43.74 30.62 30.67 48.99 15.34 48.89 15.28 48.61 39.63 14.16 65.55 52.23Z"/>
