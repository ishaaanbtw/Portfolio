<!-- The Cypherock mark. Traced from the supplied artwork at 4x: it is all
     straight lines, so this is two polygons rather than a curve fit, and 0.44%
     of pixels differ from the original — all of it the antialias fringe.

     `currentColor`, so wherever this is inlined it takes the surrounding text's
     colour. Used as an <img> it falls back to black; set a fill there instead.
     The hero tag does not use this file — it inlines the same paths from
     PILL_ICON in site.js so the mark can inherit the label's grey. Keep the two
     in step. -->
