  <rect width="128" height="128" fill="#d8232a"/>
  <rect width="128" height="9" fill="#fff" opacity=".26"/>
  <rect width="8" height="128" fill="#fff" opacity=".26"/>
  <rect y="116" width="128" height="12" fill="#000" opacity=".17"/>
  <rect x="118" width="10" height="128" fill="#000" opacity=".17"/>
  <circle cx="70" cy="74" r="36" fill="#000" opacity=".32" filter="url(#b)"/>
  <circle cx="64" cy="64" r="36" fill="#d8232a"/>
  <path d="M33.98 59.18A30.24 30.24 0 0 1 69.25 34.22" stroke="rgba(255,255,255,.34)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M95.7 57.8A31.68 31.68 0 0 1 50.1 92.5" stroke="rgba(0,0,0,.24)" stroke-width="8" fill="none" stroke-linecap="round"/>
