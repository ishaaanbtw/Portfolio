<meta name="theme-color" content="#f7f6f3">
<!-- The one font the page always needs, started before the stylesheet has been
     parsed. Without this the request only begins once the CSS is read and the
     first glyph is wanted, which is a swap you can see. The italic and the mono
     are not preloaded on purpose: one word on the home page is italic and only
     case studies set code, so both can arrive late without anything moving. -->
<link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
<!-- The X0 card's thumbnail is a video, and until its poster is painted the
     card shows the CSS preview underneath it — a flash of blue on every cold
     load. The poster is fetched here rather than when site.js reaches the
     showcase, so it is already in the cache by the time the card mounts.
     Remove this line if that card stops using a video thumbnail. -->
<link rel="preload" as="image" href="assets/media/x0/companion-thumb.webp">
<!-- THE ENTRANCE DECIDES BEFORE THE FIRST PAINT.
     The home page opens on a dark sheet with a LEGO assembly drawing on it
     (site.css section 44), and the stylesheet's own `body` is paper — so a
     decision made when site.js runs, at the end of the document, is one
     painted frame of the wrong colour. This applies the same test site.js
     applies and sets the flag now: only the real thing, only an actual
     arrival (a cold visit or a refresh, not Work -> Home and not the back
     button), and never with reduced motion asked for.
     The timeout is the failsafe: if site.js never arrives the class comes
     off by itself and the page is simply the page. -->
<script>
(function () {
  try {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var n = (performance.getEntriesByType('navigation')[0] || {}).type || '';
    if (n !== 'reload') {
      if (n === 'back_forward') return;
      if (document.referrer && new URL(document.referrer).origin === location.origin) return;
    }
    document.documentElement.classList.add('wake-armed');
    setTimeout(function () {
      document.documentElement.classList.remove('wake-armed');
    }, 4000);
  } catch (e) {}
})();
</script>
