<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found — Ishaan Gupta</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f6f3">
<link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<!-- THE ENTRANCE DECIDES BEFORE THE FIRST PAINT.
     What this is: site.js section 5c2c, site.css section 44. Why it cannot
     live in site.js: the sheet is charcoal and the page is paper, and site.js
     runs at the end of the body — a decision made there is one painted frame
     of the wrong colour before the right one. So the test is applied here, in
     the head, and it is identical in every page that loads the script.

     ARRIVING, NOT MOVING. An intro is something you sit through when you get
     somewhere; the moment it becomes a toll on every click it stops being an
     intro and starts being a wait. So: a cold visit yes, a link from
     elsewhere yes, a reload yes — a reload is someone deliberately asking for
     this page again. A click from one page of this site to another, no: the
     referrer says they were already here. Back and forward, no: returning to
     a page is not arriving at it.

     This was briefly gated on sessionStorage instead — once per tab, reloads
     included. That is a tidier sentence and a worse rule: it makes the one
     thing you do most while building the site the one thing that cannot show
     you the site.

     The timeout is the failsafe: if site.js never lands, the class comes off
     by itself and the page is simply the page. -->
<script>
(function () {
  try {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var n = (performance.getEntriesByType('navigation')[0] || {}).type || '';
    if (n === 'back_forward') return;
    if (n !== 'reload') {
      var inside = false;
      try {
        inside = !!document.referrer
          && new URL(document.referrer).origin === location.origin;
      } catch (e) { inside = false; }
      if (inside) return;
    }
    var d = document.documentElement;
    d.classList.add('wake-armed');
    setTimeout(function () { d.classList.remove('wake-armed'); }, 4000);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="assets/css/site.css">
<!-- The mark follows the reader's system theme, not the site's. favicon.svg
     carries the media query inside it, which Chrome and Firefox honour;
     Safari renders SVG favicons but ignores their CSS, so the dark copy is
     also linked with a media attribute it does understand. The PNG is for
     anything that cannot take an SVG at all, and favicon.ico answers the
     request browsers make whether it is linked or not. The apple-touch icon
     has to be a PNG — iOS will not take the SVG — and is full-bleed square
     because iOS rounds the corners itself.

     AT THE ROOT, NOT IN assets/img, AND THAT IS A CACHING DECISION. Everything
     under assets/img is pictures that never change once they are published, so
     vercel.json tells browsers to keep them for a week. An icon is not that: it
     is a small file that changes when the brand does, and a week of a stale one
     is a week of the old mark in everybody's tab. Out here it falls under the
     short-lived rule instead — and it is where /favicon.ico and
     /apple-touch-icon.png are probed for anyway. -->
<link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<!-- THE SAME PAGE AS EVERY OTHER PAGE, WHICH IS THE POINT.

     This used to be a standalone document with its own inline stylesheet and no
     scripts — a dead end that happened to match the palette. It now boots the
     same shell as the rest of the site, so the canvas, the dot grid, the
     toolbar, the physics, the snapping, the sounds and the sky are the ones
     that already exist rather than a second implementation that only this page
     uses. `data-page` is the whole switch; Pages.notfound builds the room. -->
<body data-page="notfound">

  <nav id="nav" class="nav" aria-label="Primary"></nav>

  <div class="sheet">
    <main id="main">
      <div id="hero"></div>
    </main>
  </div>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
