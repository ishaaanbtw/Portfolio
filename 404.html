<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found — Ishaan Gupta</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f6f3">
<link rel="preload" href="assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<!-- THE ENTRANCE DECIDES BEFORE THE FIRST PAINT, AND IT ONLY EVER RUNS ONCE.
     What this is: site.js section 5c2c, site.css section 44. Why it cannot
     live in site.js: the sheet is charcoal and the page is paper, and site.js
     runs at the end of the body — a decision made there is one painted frame
     of the wrong colour before the right one. So the test is applied here, in
     the head, and it is identical in every page that loads the script.
     ONCE PER VISIT. `sessionStorage` is per tab and survives navigation, so
     the first page someone lands on gets the entrance and nothing after it
     does — not a click through to Work, not a reload, not the back button. An
     intro is something you sit through when you arrive, not every time you
     move. Closing the tab is what resets it.
     If storage throws — a locked-down browser, some private modes — the
     entrance simply does not run. Better no intro than one on every page with
     no way to remember it has been seen.
     The timeout is the failsafe: if site.js never lands, the class comes off
     by itself and the page is simply the page. -->
<script>
(function () {
  try {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (sessionStorage.getItem('wake')) return;
    sessionStorage.setItem('wake', '1');
    var d = document.documentElement;
    d.classList.add('wake-armed');
    setTimeout(function () { d.classList.remove('wake-armed'); }, 4000);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="assets/css/site.css">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
</head>
<!-- THE SAME PAGE AS EVERY OTHER PAGE, WHICH IS THE POINT.

     This used to be a standalone document with its own inline stylesheet and no
     scripts — a dead end that happened to match the palette. It now boots the
     same shell as the rest of the site, so the canvas, the dot grid, the
     toolbar, the physics, the snapping, the sounds and the sky are the ones
     that already exist rather than a second implementation that only this page
     uses. `data-page` is the whole switch; Pages.notfound builds the room. -->
<body data-page="notfound">

  <nav id="nav" class="nav" aria-label="Primary"></nav>

  <div class="sheet">
    <main id="main">
      <div id="hero"></div>
    </main>
  </div>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
